<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Caching from First Principles — 30 second sample</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #020306; overflow: hidden; font-family: Inter, Arial, sans-serif; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh); background: #05070D; box-shadow: 0 0 70px rgba(0,0,0,.75); }
    #preview-ui { display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(92vw, 760px); padding: 12px 16px; border: 1px solid rgba(238,241,247,.16); border-radius: 14px; background: rgba(10,12,18,.88); backdrop-filter: blur(14px); color: #EEF1F7; z-index: 2; }
    body.preview #preview-ui { display: block; }
    #preview-ui .row { display: flex; align-items: center; gap: 10px; }
    #preview-ui button { border: 0; border-radius: 999px; background: #9D83FF; color: #08090D; font-weight: 700; padding: 8px 14px; cursor: pointer; }
    #preview-ui input[type=range] { flex: 1; accent-color: #9D83FF; }
    #time { font: 12px/1.2 "DejaVu Sans Mono", monospace; color: #9AA5B9; min-width: 88px; text-align: right; }
    #preview-ui small { display:block; color:#9AA5B9; margin-top: 7px; letter-spacing: .04em; }
  </style>
</head>
<body>
  <canvas id="c" width="1920" height="1080" aria-label="Caching from First Principles animation"></canvas>
  <audio id="audio" preload="metadata" src="mix.wav"></audio>
  <div id="preview-ui">
    <div class="row"><button id="play" type="button">Play</button><input id="scrub" type="range" min="0" max="30" step="0.01" value="0"><span id="time">00:00.00 / 00:30.00</span></div>
    <small>Preview mode · deterministic Canvas source · 16:9 landscape · synchronized narration and captions</small>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
