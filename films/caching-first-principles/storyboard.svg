    <rect x="630" y="145" width="540" height="460" rx="24" fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18"/>
    <rect x="1200" y="145" width="540" height="460" rx="24" fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18"/>
    <rect x="60" y="650" width="540" height="460" rx="24" fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18"/>
    <rect x="630" y="650" width="540" height="460" rx="24" fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18"/>
    <rect x="1200" y="650" width="540" height="460" rx="24" fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18"/>
  </g>
  <!-- panel 1 -->
  <g transform="translate(60 145)"><text x="28" y="35" class="ui mono label dim">01 / 00:00—00:04.3 / KEYNOTE + SCREENCAST</text><text x="28" y="82" class="ui hero violet">50,000</text><text x="30" y="111" class="ui mono small dim">USERS · SAME PROFILE · ONE SPIKE</text><rect x="40" y="150" width="184" height="220" rx="20" fill="#101521" stroke="#e9eaf0" stroke-opacity=".32"/><rect x="54" y="184" width="156" height="142" rx="13" fill="#070a11" stroke="#e9eaf0" stroke-opacity=".12"/><circle cx="132" cy="218" r="22" fill="#9d83ff" fill-opacity=".5"/><rect x="82" y="253" width="100" height="10" rx="5" fill="#e9eaf0" fill-opacity=".65"/><rect x="82" y="275" width="75" height="8" rx="4" fill="#8e97ad" fill-opacity=".5"/><path d="M270 242c72-78 144-78 208 0M270 270c72-44 142-44 208 0" fill="none" stroke="#9d83ff" stroke-width="5" opacity=".7" filter="url(#glowV)"/><circle cx="271" cy="242" r="10" fill="#9d83ff"/><circle cx="271" cy="270" r="10" fill="#9d83ff"/><text x="28" y="411" class="ui mono small red">TRAFFIC SPIKE / SAME KEY</text></g>
  <!-- panel 2 -->
  <g transform="translate(630 145)"><text x="28" y="35" class="ui mono label dim">02 / 00:04.3—00:11.8 / FLYTHROUGH</text><text x="28" y="82" class="ui hero red">BOTTLENECK</text><path d="M70 240H168L245 290H366L442 240" fill="none" stroke="#9d83ff" stroke-width="6"/><circle cx="92" cy="240" r="13" fill="#9d83ff"/><circle cx="194" cy="290" r="13" fill="#ff5864"/><circle cx="390" cy="290" r="13" fill="#ff5864"/><g transform="translate(154 200)"><path d="M0 22 60 0l60 22-60 23z" fill="#374258"/><path d="M0 22v74l60 24V45z" fill="#1b2230"/><path d="M120 22v74L60 120V45z" fill="#252e40"/><text x="60" y="61" text-anchor="middle" class="ui mono tiny">DATABASE</text><rect x="16" y="70" width="88" height="17" rx="6" fill="#ff5864" fill-opacity=".2" stroke="#ff5864"/><text x="60" y="83" text-anchor="middle" class="ui mono tiny red">POOL FULL</text></g><text x="28" y="411" class="ui mono small dim">APP → DB → DISK / ~4 ms</text></g>
