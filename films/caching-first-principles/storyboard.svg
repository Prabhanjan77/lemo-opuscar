    <g transform="translate(28 145)"><rect width="160" height="54" rx="13" fill="#0d1522" stroke="#e9eaf0" stroke-opacity=".3"/><circle cx="27" cy="27" r="14" fill="#9d83ff" fill-opacity=".5"/><text x="50" y="25" class="ui mono tiny">USER 01</text><text x="50" y="41" class="ui mono tiny dim">GET /profile</text></g>
    <g transform="translate(28 226)"><rect width="160" height="54" rx="13" fill="#0d1522" stroke="#e9eaf0" stroke-opacity=".3"/><circle cx="27" cy="27" r="14" fill="#9d83ff" fill-opacity=".5"/><text x="50" y="25" class="ui mono tiny">USER 02</text><text x="50" y="41" class="ui mono tiny dim">GET /profile</text></g>
    <g transform="translate(28 307)"><rect width="160" height="54" rx="13" fill="#0d1522" stroke="#e9eaf0" stroke-opacity=".3"/><circle cx="27" cy="27" r="14" fill="#9d83ff" fill-opacity=".5"/><text x="50" y="25" class="ui mono tiny">USER 03</text><text x="50" y="41" class="ui mono tiny dim">GET /profile</text></g>
