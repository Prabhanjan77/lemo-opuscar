<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#070a12"/><stop offset="1" stop-color="#020306"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#151b2a"/><stop offset="1" stop-color="#0b0f18"/></linearGradient>
    <filter id="glowV"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowG"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .ui{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#e9eaf0}.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:2px}.dim{fill:#8e97ad}.violet{fill:#9d83ff}.red{fill:#ff5864}.green{fill:#6eedb3}.small{font-size:19px}.label{font-size:15px}.head{font-size:31px;font-weight:700}.hero{font-size:45px;font-weight:700}.tiny{font-size:13px}
    </style>
  </defs>
  <rect width="1800" height="1220" fill="url(#bg)"/>
  <text x="60" y="56" class="ui mono label dim">CACHING FROM FIRST PRINCIPLES / 30 S SAMPLE / STORYBOARD</text>
  <text x="60" y="102" class="ui head">Traffic spike → miss → population → hit</text>
  <g id="p">
