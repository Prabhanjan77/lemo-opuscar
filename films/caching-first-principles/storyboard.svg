<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <rect width="1800" height="1220" fill="#f5f2eb"/>
  <style>
    .ink{fill:#17171b;font-family:Arial,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.dim{fill:#6e6d73}.small{font-size:13px}.label{font-size:14px;font-weight:700;letter-spacing:2px}.headline{font-size:31px;font-weight:700}.body{font-size:16px}.violet{fill:#6757d9}.red{fill:#d94f63}.green{fill:#299b6d}.blue{fill:#3d7aaa}.amber{fill:#c88926}.line{stroke:#17171b;stroke-opacity:.18;fill:none}.soft{fill:#fffdf8;stroke:#17171b;stroke-opacity:.16;stroke-width:2}
  </style>
  <text x="60" y="54" class="ink mono small dim">CACHING / FROM FIRST PRINCIPLES / ARCHITECTURAL SAMPLE</text>
  <text x="60" y="105" class="ink headline" font-size="34">One click → repeated work → cache hit</text>

  <g transform="translate(60 145)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">01 · 00:00—00:05.6</text><text x="28" y="88" class="ink headline">ONE CLICK</text><text x="28" y="124" class="ink mono label violet">ONE REQUEST</text><rect x="30" y="185" width="155" height="64" rx="12" fill="#fffdf8" stroke="#17171b" stroke-opacity=".35"/><text x="50" y="213" class="ink mono small dim">PROFILE</text><text x="50" y="236" class="ink" font-size="14" font-weight="700">AANYA RAO</text><path d="M185 217 C260 140 320 180 345 205 M410 190 C450 120 500 155 515 175" stroke="#6757d9" stroke-width="4" fill="none"/><rect x="250" y="255" width="95" height="50" rx="8" fill="#fffdf8" stroke="#17171b"/><text x="277" y="285" class="ink mono small violet">API</text><rect x="410" y="180" width="95" height="50" rx="8" fill="#fffdf8" stroke="#17171b"/><text x="430" y="210" class="ink mono small blue">DB</text><circle cx="210" cy="275" r="5" class="red"/><circle cx="230" cy="250" r="5" class="red"/><circle cx="250" cy="275" r="5" class="red"/><circle cx="270" cy="245" r="5" class="red"/><text x="28" y="405" class="ink mono label green">ONE CLICK → ONE REQUEST</text></g>

  <g transform="translate(630 145)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">02 · 00:05.6—00:11.5</text><text x="28" y="88" class="ink headline">REPEATED WORK</text><text x="28" y="124" class="ink mono label red">DATABASE BOTTLENECK</text><text x="28" y="220" class="ink red" font-size="58" font-weight="700">≈ 4 ms</text><path d="M90 310 C160 230 245 250 285 290 M330 280 C390 210 450 240 490 315" stroke="#6757d9" stroke-width="4" fill="none"/><rect x="80" y="300" width="95" height="50" rx="8" fill="#fffdf8" stroke="#17171b"/><text x="100" y="330" class="ink mono small violet">API</text><rect x="275" y="270" width="110" height="58" rx="8" fill="#fff0f1" stroke="#d94f63"/><text x="292" y="305" class="ink mono small red">DB</text><ellipse cx="480" cy="335" rx="40" ry="14" fill="#e9e5dc" stroke="#17171b"/><ellipse cx="480" cy="335" rx="18" ry="6" fill="#fffdf8" stroke="#17171b"/><text x="28" y="405" class="ink mono label red">POOL FULL / DISK READS</text></g>

  <g transform="translate(1200 145)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">03 · 00:11.5—00:17.7</text><text x="28" y="88" class="ink headline">ADD A CACHE</text><text x="28" y="124" class="ink mono label violet">MISS → READ → SAVE</text><path d="M80 280 C150 190 230 215 270 270 M330 265 C380 180 450 205 490 290" stroke="#6757d9" stroke-width="4" fill="none"/><rect x="55" y="250" width="95" height="50" rx="8" fill="#fffdf8" stroke="#17171b"/><text x="75" y="280" class="ink mono small violet">API</text><rect x="205" y="225" width="120" height="70" rx="8" fill="#eeeafd" stroke="#6757d9"/><text x="225" y="258" class="ink mono small violet">CACHE</text><text x="225" y="279" class="ink mono small dim">EMPTY</text><rect x="380" y="200" width="105" height="58" rx="8" fill="#fffdf8" stroke="#3d7aaa"/><text x="398" y="235" class="ink mono small blue">DATABASE</text><rect x="30" y="390" width="110" height="32" rx="16" fill="#fff0f1" stroke="#d94f63"/><text x="54" y="412" class="ink mono small red">MISS</text><text x="170" y="412" class="ink mono small red">→ READ DATABASE</text><text x="170" y="450" class="ink mono small violet">→ SAVE IN MEMORY</text></g>

  <g transform="translate(60 650)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">04 · 00:17.7—00:23.6</text><text x="28" y="88" class="ink headline">CACHE HIT</text><text x="28" y="124" class="ink mono label green">SHORTER COMMON PATH</text><text x="28" y="245" class="ink green" font-size="65" font-weight="700">1.1 ms</text><text x="30" y="280" class="ink mono label green">MEMORY PATH</text><path d="M105 355 C180 270 275 290 350 335" stroke="#299b6d" stroke-width="6" fill="none"/><rect x="50" y="345" width="95" height="50" rx="8" fill="#fffdf8" stroke="#17171b"/><text x="70" y="375" class="ink mono small violet">API</text><rect x="330" y="300" width="120" height="70" rx="8" fill="#e7f7ef" stroke="#299b6d"/><text x="350" y="333" class="ink mono small green">HIT</text><text x="350" y="353" class="ink mono small dim">CACHE</text><text x="28" y="420" class="ink mono small dim">≈4 ms DATABASE PATH / DIMMED</text></g>

  <g transform="translate(630 650)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">05 · 00:23.6—00:30</text><text x="28" y="88" class="ink headline">THE TRADE-OFF</text><text x="28" y="124" class="ink mono label amber">TTL · SOURCE OF TRUTH · DESIGN</text><rect x="150" y="165" width="100" height="45" rx="7" fill="#fffdf8" stroke="#6757d9"/><text x="182" y="193" class="ink mono small violet">APP</text><rect x="150" y="235" width="100" height="45" rx="7" fill="#e7f7ef" stroke="#299b6d"/><text x="174" y="263" class="ink mono small green">CACHE</text><rect x="150" y="305" width="100" height="45" rx="7" fill="#fffdf8" stroke="#3d7aaa"/><text x="166" y="333" class="ink mono small blue">DATABASE</text><rect x="150" y="375" width="100" height="45" rx="7" fill="#fffdf8" stroke="#6e6d73"/><text x="180" y="403" class="ink mono small dim">DISK</text><circle cx="415" cy="250" r="68" fill="none" stroke="#c88926" stroke-width="10"/><text x="415" y="244" text-anchor="middle" class="ink mono label amber">TTL</text><text x="415" y="270" text-anchor="middle" class="ink mono label amber">60 s</text><text x="300" y="365" class="ink mono small red">STALE DATA / STAMPEDE</text><text x="300" y="390" class="ink mono small dim">STILL NEED DESIGN</text></g>

  <g transform="translate(1200 650)"><rect width="540" height="460" rx="22" class="soft"/><text x="28" y="38" class="ink mono small dim">06 · FINAL HOLD</text><text x="28" y="88" class="ink headline">THE SHORTCUT</text><text x="28" y="124" class="ink mono label green">DATABASE STILL MATTERS</text><text x="28" y="255" class="ink green" font-size="68" font-weight="700">LESS</text><text x="28" y="320" class="ink" font-size="43" font-weight="700">REPEATED WORK</text><rect x="28" y="370" width="460" height="52" rx="12" fill="#fff0f1" stroke="#d94f63"/><text x="50" y="402" class="ink mono small red">TTL / STALE DATA / STAMPEDE</text><text x="28" y="448" class="ink mono small dim">A cache shortens the common read path.</text></g>

  <text x="60" y="1172" class="ink mono small dim">VIOLET = ROUTE · RED = PRESSURE / MISS · GREEN = HIT · SOURCE: PRABHANJAN2.SUBSTACK.COM</text>
</svg>
