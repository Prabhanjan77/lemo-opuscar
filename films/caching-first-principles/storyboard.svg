  <g transform="translate(60 650)">
    <text x="28" y="35" class="ui mono label dim">04 / 00:17.8—00:23.5 / KEYNOTE + SCREENCAST</text><text x="28" y="80" class="ui hero green">HIT</text><text x="30" y="108" class="ui mono small dim">HOT DATA / SHORTER COMMON PATH</text>
