  <g transform="translate(1200 145)"><text x="28" y="35" class="ui mono label dim">03 / 00:11.8—00:19.1 / MISS PATH</text><text x="28" y="82" class="ui hero violet">MISS → DB</text><rect x="42" y="166" width="110" height="150" rx="16" fill="#182132" stroke="#9d83ff"/><text x="97" y="197" text-anchor="middle" class="ui mono tiny">CACHE</text><rect x="56" y="226" width="82" height="42" rx="9" fill="#ff5864" fill-opacity=".16" stroke="#ff5864"/><text x="97" y="252" text-anchor="middle" class="ui mono tiny red">MISS</text><path d="M152 240H262M262 240l-14-9M262 240l-14 9" fill="none" stroke="#ff5864" stroke-width="5"/><path d="M402 240H478" fill="none" stroke="#9d83ff" stroke-width="5"/><g transform="translate(258 168)"><ellipse cx="72" cy="18" rx="72" ry="18" fill="#38445b"/><path d="M0 18v112c0 22 144 22 144 0V18" fill="#1a202d" stroke="#e9eaf0" stroke-opacity=".3"/><text x="72" y="68" text-anchor="middle" class="ui mono tiny">DATABASE</text><text x="72" y="96" text-anchor="middle" class="ui mono tiny dim">read profile</text></g><text x="28" y="411" class="ui mono small dim">READ → STORE → RESPOND</text></g>
  <!-- panel 4 -->
  <g transform="translate(60 650)"><text x="28" y="35" class="ui mono label dim">04 / 00:19.1—00:25.5 / KEYNOTE + SCREENCAST</text><text x="28" y="82" class="ui hero green">1.1 ms</text><text x="30" y="111" class="ui mono small dim">CACHE HIT / HOT DATA IN MEMORY</text><path d="M56 228H202L278 274H450" fill="none" stroke="#6eedb3" stroke-width="7" filter="url(#glowG)"/><circle cx="74" cy="228" r="13" fill="#6eedb3"/><rect x="190" y="205" width="118" height="58" rx="13" fill="#6eedb3" fill-opacity=".16" stroke="#6eedb3"/><text x="249" y="240" text-anchor="middle" class="ui mono small green">HIT</text><rect x="392" y="213" width="91" height="91" rx="14" fill="#182132" stroke="#e9eaf0" stroke-opacity=".3"/><circle cx="437" cy="248" r="20" fill="#9d83ff" fill-opacity=".5"/><text x="28" y="411" class="ui mono small dim">~4 ms DB PATH / DIMMED</text></g>
  <!-- panel 5 -->
  <g transform="translate(630 650)"><text x="28" y="35" class="ui mono label dim">05 / 00:25.5—00:30 / TEARDOWN</text><text x="28" y="82" class="ui hero violet">TTL 60 s</text><text x="30" y="111" class="ui mono small dim">SEPARATE THE PATH / NAME THE TRADE-OFF</text><g transform="translate(60 160)"><path d="M0 30 120 0l120 30-120 36z" fill="#434f66" stroke="#e9eaf0" stroke-opacity=".3"/><path d="M0 30v58l120 35V66z" fill="#222b3b"/><path d="M240 30v58l-120 35V66z" fill="#2d394c"/><path d="M0 130 120 100l120 30-120 35z" fill="#252e40"/><path d="M0 130v58l120 35v-58z" fill="#171e2b"/><path d="M240 130v58l-120 35v-58z" fill="#20293a"/><path d="M0 230 120 200l120 30-120 35z" fill="#374258"/><path d="M0 230v58l120 35v-58z" fill="#1b2230"/><path d="M240 230v58l-120 35v-58z" fill="#252e40"/><path d="M277 72H420M277 174H420M277 274H420" stroke="#9d83ff" stroke-width="3"/><text x="430" y="78" class="ui mono tiny">APP</text><text x="430" y="180" class="ui mono tiny">CACHE / TTL</text><text x="430" y="280" class="ui mono tiny">DB + DISK</text></g><text x="28" y="411" class="ui mono small red">EXPIRY → MISS / STAMPEDE NEEDS DESIGN</text></g>
