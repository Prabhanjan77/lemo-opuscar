  <rect width="1800" height="1220" fill="url(#bg)"/>
  <text x="60" y="56" class="ui mono label dim">CACHING FROM FIRST PRINCIPLES / ARCHITECT'S CUT / STORYBOARD</text>
  <text x="60" y="102" class="ui head">One click → many clients → one shared read path</text>
  <g fill="url(#panel)" stroke="#e9eaf0" stroke-opacity=".18">
    <rect x="60" y="145" width="540" height="460" rx="24"/><rect x="630" y="145" width="540" height="460" rx="24"/><rect x="1200" y="145" width="540" height="460" rx="24"/>
    <rect x="60" y="650" width="540" height="460" rx="24"/><rect x="630" y="650" width="540" height="460" rx="24"/><rect x="1200" y="650" width="540" height="460" rx="24"/>
  </g>
