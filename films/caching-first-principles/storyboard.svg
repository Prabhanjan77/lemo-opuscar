  <text x="60" y="1170" class="ui mono label dim">SOURCE: PRABHANJAN2.SUBSTACK.COM / CACHING-FROM-FIRST-PRINCIPLES · RED = PRESSURE / MISS · VIOLET = ROUTE · GREEN = HIT</text>
