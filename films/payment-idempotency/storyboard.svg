<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2860" viewBox="0 0 1080 2860">
  <defs>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#151522"/><stop offset="1" stop-color="#06070A"/></linearGradient>
    <radialGradient id="violet"><stop stop-color="#9D83FF" stop-opacity=".24"/><stop offset="1" stop-color="#9D83FF" stop-opacity="0"/></radialGradient>
    <filter id="glowV"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowR"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowG"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#E9EAF0" stroke-opacity=".045"/><path d="M0 0H48V48" fill="none" stroke="#E9EAF0" stroke-opacity=".018"/></pattern>
    <style>
      .ui{font-family:DejaVu Sans,Arial,sans-serif;fill:#E9EAF0}.mono{font-family:DejaVu Sans Mono,monospace;letter-spacing:1.5px}.dim{fill:#9297A8}.label{font-size:15px;letter-spacing:3px}.small{font-size:18px}.body{font-size:22px}.head{font-size:27px;font-weight:700;letter-spacing:2px}.hero{font-size:45px;font-weight:700;letter-spacing:1px}.number{font-size:75px;font-weight:700}.violet{fill:#9D83FF}.red{fill:#FF5864}.green{fill:#6EEDB3}.strokeV{stroke:#9D83FF}.strokeR{stroke:#FF5864}.strokeG{stroke:#6EEDB3}
    </style>
  </defs>
  <rect width="1080" height="2860" fill="#020306"/>
  <text x="40" y="27" class="ui mono label dim">PAYMENT IDEMPOTENCY · STORYBOARD / 60 S · 1080 × 1920</text>

  <!-- panel helper backgrounds -->
  <g id="panel">
    <rect width="480" height="880" rx="24" fill="url(#stage)" stroke="#E9EAF0" stroke-opacity=".14"/>
    <rect x="18" y="18" width="444" height="844" rx="18" fill="url(#grid)" opacity=".8"/>
    <circle cx="366" cy="176" r="230" fill="url(#violet)" opacity=".55"/>
    <path d="M28 814H452" stroke="#E9EAF0" stroke-opacity=".1"/>
  </g>

  <!-- 1 hook -->
  <g transform="translate(40 55)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">01 · 00:00—00:08</text>
    <text x="32" y="86" class="ui head">THE HOOK</text>
    <text x="32" y="122" class="ui small dim">one action · two requests</text>
    <!-- phone -->
    <g transform="translate(118 180)">
      <rect x="0" y="0" width="244" height="440" rx="30" fill="#1B1F2C" stroke="#E9EAF0" stroke-opacity=".34" stroke-width="2"/>
      <rect x="14" y="38" width="216" height="358" rx="17" fill="#0B0E15" stroke="#E9EAF0" stroke-opacity=".11"/>
      <rect x="91" y="14" width="62" height="8" rx="4" fill="#2F3442"/>
      <text x="34" y="88" class="ui mono label dim">CHECKOUT</text>
      <text x="34" y="172" class="ui number">₹2,000</text>
      <text x="34" y="206" class="ui small dim">one logical payment</text>
      <rect x="30" y="250" width="184" height="64" rx="15" fill="#9D83FF" filter="url(#glowV)"/>
      <text x="122" y="290" text-anchor="middle" class="ui head" fill="#08090D">PAY</text>
      <circle cx="202" cy="370" r="7" fill="#9D83FF"/>
      <circle cx="202" cy="370" r="17" fill="none" stroke="#9D83FF" stroke-opacity=".3"/>
    </g>
    <!-- click arcs and packets -->
    <g fill="none" stroke="#9D83FF" stroke-width="4" stroke-linecap="round" opacity=".9">
      <path d="M360 474c35 3 43 25 28 44"/><path d="M360 503c35 3 43 25 28 44"/>
      <path d="M328 520C418 560 398 644 304 681"/><path d="M344 542C450 595 426 698 302 738"/>
    </g>
    <g transform="translate(288 680)"><rect width="64" height="34" rx="9" fill="#9D83FF"/><text x="32" y="23" text-anchor="middle" class="ui mono small" fill="#07080C">REQ</text></g>
    <g transform="translate(286 737)"><rect width="64" height="34" rx="9" fill="#9D83FF"/><text x="32" y="23" text-anchor="middle" class="ui mono small" fill="#07080C">REQ</text></g>
    <text x="32" y="795" class="ui hero red">DOUBLE CHARGE?</text>
  </g>

  <!-- 2 problem -->
  <g transform="translate(560 55)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">02 · 00:08—00:17</text>
    <text x="32" y="86" class="ui head">THE PROBLEM</text>
    <text x="32" y="122" class="ui small dim">without protection · duplicate execution</text>
    <!-- packets -->
    <g transform="translate(36 196)"><rect width="86" height="40" rx="11" fill="#9D83FF"/><text x="43" y="27" text-anchor="middle" class="ui mono small" fill="#07080C">REQ 01</text></g>
    <g transform="translate(36 268)"><rect width="86" height="40" rx="11" fill="#9D83FF"/><text x="43" y="27" text-anchor="middle" class="ui mono small" fill="#07080C">REQ 02</text></g>
    <!-- routes -->
    <path d="M128 216C195 216 182 280 236 280" fill="none" stroke="#9D83FF" stroke-width="5"/>
    <path d="M128 288C195 288 182 330 236 330" fill="none" stroke="#9D83FF" stroke-width="5"/>
    <!-- server -->
    <g transform="translate(220 208)">
      <path d="M0 24L46 0H210L164 24Z" fill="#2C3242"/><path d="M0 24V280L46 304V0Z" fill="#171A25"/><path d="M46 0V280L210 280V0Z" fill="#222735"/>
      <text x="64" y="50" class="ui mono small">PAYMENT</text><text x="64" y="75" class="ui mono small">SERVER</text>
      <rect x="62" y="105" width="124" height="48" rx="9" fill="#FF5864" fill-opacity=".2" stroke="#FF5864"/>
      <text x="124" y="136" text-anchor="middle" class="ui mono small red">CHARGE</text>
      <rect x="62" y="177" width="124" height="48" rx="9" fill="#FF5864" fill-opacity=".2" stroke="#FF5864"/>
      <text x="124" y="208" text-anchor="middle" class="ui mono small red">CHARGE</text>
    </g>
    <!-- records -->
    <g transform="translate(94 570)">
      <rect width="286" height="70" rx="12" fill="#151923" stroke="#FF5864" stroke-opacity=".7"/><text x="20" y="30" class="ui mono small dim">TXN_8F2A</text><text x="20" y="54" class="ui mono small red">₹2,000 · CAPTURED</text>
      <rect y="86" width="286" height="70" rx="12" fill="#151923" stroke="#FF5864" stroke-opacity=".7"/><text x="20" y="116" class="ui mono small dim">TXN_91C0</text><text x="20" y="140" class="ui mono small red">₹2,000 · CAPTURED</text>
    </g>
    <path d="M80 548H398V752H80Z" fill="none" stroke="#FF5864" stroke-width="3" stroke-dasharray="9 9"/>
    <text x="32" y="800" class="ui hero red">TWICE PROCESSED</text>
  </g>

  <!-- 3 solution -->
  <g transform="translate(40 985)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">03 · 00:17—00:30</text>
    <text x="32" y="86" class="ui head">THE SOLUTION</text>
    <text x="32" y="122" class="ui small dim">same key · one logical operation</text>
    <!-- key -->
    <g transform="translate(70 180)" filter="url(#glowV)">
      <circle cx="54" cy="52" r="30" fill="none" stroke="#9D83FF" stroke-width="9"/><path d="M80 52H292M234 52v28M270 52v28" stroke="#9D83FF" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="72" y="300" class="ui mono hero violet">pay_123</text>
    <!-- two request lanes -->
    <g transform="translate(32 390)"><rect width="104" height="46" rx="12" fill="#222735" stroke="#9D83FF"/><text x="52" y="30" text-anchor="middle" class="ui mono small violet">REQ + KEY</text></g>
    <g transform="translate(32 466)"><rect width="104" height="46" rx="12" fill="#222735" stroke="#9D83FF"/><text x="52" y="30" text-anchor="middle" class="ui mono small violet">RETRY + KEY</text></g>
    <path d="M138 413C200 413 188 470 236 470M138 489C200 489 188 520 236 520" fill="none" stroke="#9D83FF" stroke-width="4"/>
    <!-- db cutaway -->
    <g transform="translate(236 386)">
      <ellipse cx="92" cy="22" rx="92" ry="22" fill="#31384A" stroke="#E9EAF0" stroke-opacity=".2"/><path d="M0 22V205C0 230 184 230 184 205V22" fill="#161A25" stroke="#E9EAF0" stroke-opacity=".2"/><ellipse cx="92" cy="205" rx="92" ry="22" fill="#10131B" stroke="#E9EAF0" stroke-opacity=".2"/>
      <rect x="24" y="74" width="136" height="64" rx="10" fill="#9D83FF" fill-opacity=".16" stroke="#9D83FF"/><text x="92" y="101" text-anchor="middle" class="ui mono small violet">pay_123</text><text x="92" y="126" text-anchor="middle" class="ui mono small violet">PROCESSING</text>
      <path d="M16 153H168" stroke="#9D83FF" stroke-width="3"/>
    </g>
    <text x="32" y="700" class="ui mono small dim">ATOMIC RESERVATION</text><text x="32" y="736" class="ui body">one owner token, not a read-then-write</text>
    <rect x="32" y="776" width="350" height="50" rx="12" fill="#9D83FF" fill-opacity=".12" stroke="#9D83FF"/><text x="207" y="809" text-anchor="middle" class="ui mono small violet">UNIQUE(key) → ONE OWNER</text>
  </g>

  <!-- 4 safe retry -->
  <g transform="translate(560 985)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">04 · 00:30—00:43</text>
    <text x="32" y="86" class="ui head">SAFE RETRY</text>
    <text x="32" y="122" class="ui small dim">store the result · replay the response</text>
    <!-- server and db -->
    <g transform="translate(48 190)">
      <rect width="164" height="224" rx="18" fill="#222735" stroke="#E9EAF0" stroke-opacity=".2"/><text x="82" y="44" text-anchor="middle" class="ui mono small">SERVER</text><rect x="26" y="76" width="112" height="56" rx="10" fill="#9D83FF" fill-opacity=".12" stroke="#9D83FF"/><text x="82" y="111" text-anchor="middle" class="ui mono small violet">pay_123</text><circle cx="82" cy="174" r="18" fill="#6EEDB3" filter="url(#glowG)"/><path d="M73 174l7 7 13-16" fill="none" stroke="#07100D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M214 304H272" stroke="#6EEDB3" stroke-width="6" marker-end="url(#none)"/><path d="M272 304C308 304 310 364 340 364" fill="none" stroke="#6EEDB3" stroke-width="6"/>
    <g transform="translate(278 190)">
      <ellipse cx="80" cy="22" rx="80" ry="22" fill="#31384A"/><path d="M0 22V224C0 248 160 248 160 224V22" fill="#161A25" stroke="#E9EAF0" stroke-opacity=".2"/><ellipse cx="80" cy="224" rx="80" ry="22" fill="#10131B"/><rect x="18" y="72" width="124" height="98" rx="10" fill="#6EEDB3" fill-opacity=".12" stroke="#6EEDB3"/><text x="80" y="103" text-anchor="middle" class="ui mono small green">COMPLETED</text><text x="80" y="134" text-anchor="middle" class="ui mono small green">RESULT: OK</text>
    </g>
    <!-- response loops -->
    <path d="M418 408C402 500 268 514 152 430" fill="none" stroke="#6EEDB3" stroke-width="4" stroke-dasharray="10 8"/>
    <g transform="translate(64 520)"><rect width="350" height="84" rx="14" fill="#151923" stroke="#6EEDB3"/><text x="175" y="34" text-anchor="middle" class="ui mono small green">SAVED RESULT</text><text x="175" y="63" text-anchor="middle" class="ui mono small">₹2,000 · SUCCESS</text></g>
    <text x="32" y="690" class="ui hero green">ONE PAYMENT</text><text x="32" y="738" class="ui hero">TWO RESPONSES</text>
    <text x="32" y="800" class="ui mono small dim">retry never re-executes the charge</text>
  </g>

  <!-- 5 concurrency -->
  <g transform="translate(40 1915)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">05 · 00:43—00:53</text>
    <text x="32" y="86" class="ui head">THE RACE</text>
    <text x="32" y="122" class="ui small dim">simultaneous arrival · atomic ownership</text>
    <!-- two race packets -->
    <g transform="translate(34 206)"><rect width="118" height="44" rx="12" fill="#222735" stroke="#9D83FF"/><text x="59" y="29" text-anchor="middle" class="ui mono small violet">REQ A + key</text></g>
    <g transform="translate(34 302)"><rect width="118" height="44" rx="12" fill="#222735" stroke="#9D83FF"/><text x="59" y="29" text-anchor="middle" class="ui mono small violet">REQ B + key</text></g>
    <path d="M152 228C220 228 206 316 254 316M152 324C220 324 206 316 254 316" fill="none" stroke="#9D83FF" stroke-width="5"/>
    <!-- unique index db -->
    <g transform="translate(248 214)"><ellipse cx="86" cy="24" rx="86" ry="24" fill="#31384A"/><path d="M0 24V242C0 268 172 268 172 242V24" fill="#161A25" stroke="#E9EAF0" stroke-opacity=".2"/><ellipse cx="86" cy="242" rx="86" ry="24" fill="#10131B"/><rect x="16" y="76" width="140" height="78" rx="11" fill="#9D83FF" fill-opacity=".14" stroke="#9D83FF"/><text x="86" y="107" text-anchor="middle" class="ui mono small violet">pay_123</text><text x="86" y="136" text-anchor="middle" class="ui mono small violet">OWNER: A</text></g>
    <!-- loser stop -->
    <path d="M336 456C354 510 400 526 414 570" fill="none" stroke="#FF5864" stroke-width="5" stroke-dasharray="8 8"/>
    <rect x="248" y="560" width="192" height="66" rx="11" fill="#FF5864" fill-opacity=".13" stroke="#FF5864"/><text x="344" y="588" text-anchor="middle" class="ui mono small red">UNIQUE(key)</text><text x="344" y="612" text-anchor="middle" class="ui mono small red">ALREADY EXISTS</text>
    <path d="M344 632V692" stroke="#FF5864" stroke-width="4"/>
    <rect x="44" y="692" width="392" height="62" rx="12" fill="#222735" stroke="#9D83FF"/><text x="240" y="731" text-anchor="middle" class="ui mono small violet">B → IN_PROGRESS / WAIT</text>
    <text x="32" y="802" class="ui body">no fabricated green result</text>
  </g>

  <!-- 6 takeaway -->
  <g transform="translate(560 1915)">
    <use href="#panel"/>
    <text x="32" y="48" class="ui mono label dim">06 · 00:53—01:00</text>
    <text x="32" y="86" class="ui head">THE TAKEAWAY</text>
    <text x="32" y="122" class="ui small dim">one operation · safe retries</text>
    <!-- merged paths -->
    <path d="M70 270C160 270 172 344 248 390M70 350C160 350 172 400 248 390" fill="none" stroke="#9D83FF" stroke-width="6"/>
    <circle cx="70" cy="270" r="13" fill="#9D83FF"/><circle cx="70" cy="350" r="13" fill="#9D83FF"/>
    <circle cx="248" cy="390" r="56" fill="#6EEDB3" fill-opacity=".18" stroke="#6EEDB3" stroke-width="4" filter="url(#glowG)"/>
    <path d="M223 390l18 18 36-44" fill="none" stroke="#6EEDB3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="316" y="383" class="ui mono small green">ONE PAYMENT</text><text x="316" y="412" class="ui mono small dim">many safe responses</text>
    <text x="32" y="550" class="ui hero violet">SAFE RETRIES.</text><text x="32" y="604" class="ui hero">NO DUPLICATE</text><text x="32" y="658" class="ui hero">EXECUTION.</text>
    <rect x="32" y="710" width="416" height="92" rx="14" fill="#151923" stroke="#E9EAF0" stroke-opacity=".2"/><text x="52" y="742" class="ui mono small dim">SCOPE NOTE</text><text x="52" y="773" class="ui small">provider-side idempotency /</text><text x="52" y="797" class="ui small">recovery may still be required</text>
  </g>

  <text x="40" y="2840" class="ui mono label dim">STORYBOARD PREVIEW · TECHNICAL STORY FIRST · ACCENT = KEY · RED = RISK · GREEN = ONE COMPLETED PAYMENT</text>
</svg>
