<!doctype html>
<meta charset="utf-8">
<title>Why Your API Keeps Working After the User Leaves</title>
<style>
  html, body { margin:0; min-height:100%; background:#121116; color:#F4F3F0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; gap:18px; padding:28px 20px 40px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:#A694F5; margin:0; }
  video { width:min(100%, 1180px); aspect-ratio:16/9; background:#000; border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .row { display:flex; gap:22px; font-size:13px; color:#8E8A99; flex-wrap:wrap; justify-content:center; }
  a { color:#D9D9DE; text-decoration:none; border-bottom:1px solid #3A3644; }
  a:hover { color:#fff; border-color:#A694F5; }
  .hint { font-size:12px; color:#5D586B; }
</style>
<div class="wrap">
  <h1>Why Your API Keeps Working After the User Leaves</h1>
  <video id="v" controls playsinline preload="metadata" poster="poster.jpg">
    <source src="cancellation.mp4" type="video/mp4">
  </video>
  <div class="row">
    <span>2:00 · 1920×1080 · 30 fps</span>
    <a href="cancellation.srt" download>subtitles (.srt)</a>
    <a href="TREATMENT.md">treatment</a>
    <a href="CREDITS">credits</a>
  </div>
  <div class="hint">Space to play / pause · arrows scrub 5 s</div>
</div>
<script>
  const v = document.getElementById('v');
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    if (e.code === 'ArrowRight') v.currentTime = Math.min(v.duration || 120, v.currentTime + 5);
    if (e.code === 'ArrowLeft') v.currentTime = Math.max(0, v.currentTime - 5);
  });
</script>
